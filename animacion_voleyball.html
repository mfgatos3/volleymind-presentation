<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyMind & LifeLab - Secuencia 24-24 Motion Comic Lateral</title>
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #ff4757;
            --pass-color: #00e676;
            --spike-color: #ff9100;
            --bg-dark: #07090f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 15%, #151b2e 0%, #06080e 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            margin-bottom: 10px;
            text-align: center;
        }

        .project-tag {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        #comic-stage-wrapper {
            position: relative;
            width: 1080px;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(0, 210, 255, 0.2);
            border: 3px solid #232c42;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* QTE Overlay en Frame 2 */
        #qte-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 35px;
            background: linear-gradient(to top, rgba(5, 7, 15, 0.92) 0%, rgba(5, 7, 15, 0.45) 45%, transparent 100%);
            z-index: 10;
        }

        .qte-title {
            font-size: 25px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.8);
            animation: pulseText 1s infinite alternate;
        }

        @keyframes pulseText {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        .qte-timer-bar {
            width: 440px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .qte-timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--pass-color), var(--primary));
            transition: width 0.05s linear;
        }

        .qte-buttons {
            display: flex;
            gap: 26px;
        }

        .qte-btn {
            position: relative;
            padding: 15px 34px;
            border-radius: 8px;
            border: 2px solid;
            font-weight: 900;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(10, 15, 25, 0.94);
        }

        .qte-btn span.sub {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        .btn-pass {
            border-color: var(--pass-color);
            color: var(--pass-color);
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.35);
        }

        .btn-pass:hover {
            background: var(--pass-color);
            color: #000;
            transform: scale(1.06) translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 230, 118, 0.8);
        }

        .btn-spike {
            border-color: var(--spike-color);
            color: var(--spike-color);
            box-shadow: 0 0 25px rgba(255, 145, 0, 0.35);
        }

        .btn-spike:hover {
            background: var(--spike-color);
            color: #000;
            transform: scale(1.06) translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 145, 0, 0.8);
        }

        /* Barra inferior */
        .comic-toolbar {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-btn {
            background: #182033;
            border: 1px solid #313f63;
            color: #c4d1eb;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: #243150;
            color: #fff;
            border-color: var(--primary);
        }

        .frame-indicator {
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            background: rgba(0, 210, 255, 0.1);
            padding: 7px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="project-tag">VolleyMind & LifeLab</div>
        <h1>Secuencia Motion Comic 2D • Jugada Decisiva 24-24</h1>
    </header>

    <div id="comic-stage-wrapper">
        <canvas id="comicStage" width="1080" height="600"></canvas>

        <!-- QTE Overlay en Frame 2 -->
        <div id="qte-overlay">
            <div class="qte-title">¡A PUNTO DE SALTAR! ¿QUÉ DECISIÓN TOMA EL ARMADOR #8?</div>
            <div class="qte-timer-bar">
                <div class="qte-timer-fill" id="qteTimerFill"></div>
            </div>
            <div style="font-size: 11px; font-weight: 800; color: #ff8888; letter-spacing: 1.5px; text-transform: uppercase; margin-top: -14px; margin-bottom: 14px;">(SI NO DECIDES A TIEMPO, EL BALÓN SE PASARÁ DE LARGO Y SE PERDERÁ EL PUNTO)</div>
            <div class="qte-buttons">
                <button class="qte-btn btn-pass" id="btnChoosePass">
                    RUTA A: PASAR A ZONA 4 (RECOMENDADO)
                    <span class="sub">Salto y colocación flotante para el Rematador #10</span>
                </button>
                <button class="qte-btn btn-spike" id="btnChooseSpike">
                    RUTA B: FINTA / REMATAR SOLO
                    <span class="sub">Salto sorpresa para intentar toque directo</span>
                </button>
            </div>
        </div>
    </div>

    <div class="comic-toolbar">
        <button class="hud-btn" id="btnRestart">↺ Reiniciar Jugada</button>
        <div class="frame-indicator" id="frameLabel">Frame 1: El Ataque Rival y Rescate Milagroso (#5)</div>
        <button class="hud-btn" id="btnSoundToggle">🔊 Sonido (Activado)</button>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        class WebtoonAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playReceive() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }
            playHeartbeat() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.22);
            }
            playSoftTouch() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(240, this.ctx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.16);
            }
            playSpikeSmash() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.45);
                gain.gain.setValueAtTime(1.0, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.45);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.45);

                setTimeout(() => this.playWhistle(), 250);
            }
            playMonsterBlock() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(240, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(1.0, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);

                setTimeout(() => {
                    const whistle = this.ctx.createOscillator();
                    const wGain = this.ctx.createGain();
                    whistle.type = 'sine';
                    whistle.frequency.setValueAtTime(1800, this.ctx.currentTime);
                    whistle.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.4);
                    wGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    wGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                    whistle.connect(wGain);
                    wGain.connect(this.ctx.destination);
                    whistle.start();
                    whistle.stop(this.ctx.currentTime + 0.4);
                }, 350);
            }
            playWhistle() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2800, this.ctx.currentTime);
                osc.frequency.setValueAtTime(3200, this.ctx.currentTime + 0.08);
                osc.frequency.setValueAtTime(2850, this.ctx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            }
        }

        const audio = new WebtoonAudio();

        // --- CONSTANTES DEL ESTADIO LATERAL ---
        const canvas = document.getElementById('comicStage');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const NET_X = 540;          // La red divide exactamente la cancha por la mitad
        const FLOOR_Y = 490;        // Nivel del suelo de la cancha
        const NET_TOP_Y = 320;      // Borde superior de la red

        const qteOverlay = document.getElementById('qte-overlay');
        const qteTimerFill = document.getElementById('qteTimerFill');
        const frameLabel = document.getElementById('frameLabel');
        const btnRestart = document.getElementById('btnRestart');
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const btnChoosePass = document.getElementById('btnChoosePass');
        const btnChooseSpike = document.getElementById('btnChooseSpike');

        // Estado Global
        let stage = 1;              // 1: Rescate, 2: Freeze QTE, 3: El Pase, 4: Remate Punto, 5: Bloqueo
        let progress = 0;           // 0.0 a 1.0 por etapa
        let isPaused = false;
        let screenShake = 0;
        let flashOpacity = 0;
        let qteTimeRemaining = 1.0;
        let selectedRoute = null;

        // Estructura completa de jugadores en pista lateral (Siempre visibles)
        // CAMPO NUESTRO: X de 80 a 510 (LADO IZQUIERDO)
        // CAMPO RIVAL: X de 570 a 1000 (LADO DERECHO)
        const players = {
            // NUESTRO EQUIPO (Azul / Blanco)
            libero: { x: 280, y: FLOOR_Y, pose: 'dive_receive', jump: 0, num: '5', color: '#0052e6', name: 'Líbero #5' },
            setter: { x: 390, y: FLOOR_Y, pose: 'stand', jump: 0, num: '8', color: '#0052e6', name: 'Armador #8' },
            spiker: { x: 190, y: FLOOR_Y, pose: 'ready', jump: 0, num: '10', color: '#0052e6', name: 'Rematador #10' },
            teammateCover: { x: 110, y: FLOOR_Y, pose: 'crouch_cover', jump: 0, num: '3', color: '#0052e6' },

            // EQUIPO RIVAL (Negro / Rojo oscuro) - ESTRICTAMENTE EN SU CAMPO (X > NET_X)
            rivalBlockerCenter: { x: 605, y: FLOOR_Y, pose: 'stand', jump: 0, num: '1', color: '#1e293b' },
            rivalBlockerWing:   { x: 655, y: FLOOR_Y, pose: 'stand', jump: 0, num: '7', color: '#1e293b' },
            rivalBlockerSide:   { x: 705, y: FLOOR_Y, pose: 'stand', jump: 0, num: '9', color: '#1e293b' },
            rivalSpiker:        { x: 680, y: FLOOR_Y, pose: 'land_recover', jump: 0, num: '4', color: '#1e293b' },
            rivalLibero:        { x: 920, y: FLOOR_Y, pose: 'ready_defense', jump: 0, num: '2', color: '#c62828' }
        };

        const ball = {
            x: 760,
            y: 280,
            rot: 0
        };

        // Speed Lines dinámicas
        let speedLines = [];
        for (let i = 0; i < 35; i++) {
            speedLines.push({
                x: Math.random() * W,
                y: Math.random() * H,
                len: 120 + Math.random() * 200,
                speed: 20 + Math.random() * 25,
                width: 1.5 + Math.random() * 2
            });
        }

        function resetSequence() {
            audio.init();
            stage = 1;
            progress = 0;
            isPaused = false;
            screenShake = 0;
            flashOpacity = 0;
            qteTimeRemaining = 1.0;
            selectedRoute = null;
            qteOverlay.style.display = 'none';

            // Resetear posiciones y poses
            players.libero.x = 280;
            players.libero.pose = 'dive_receive';
            players.libero.jump = 0;

            players.setter.x = 380;
            players.setter.pose = 'stand';
            players.setter.jump = 0;

            players.spiker.x = 180;
            players.spiker.pose = 'stand';
            players.spiker.jump = 0;

            players.rivalBlockerCenter.jump = 0;
            players.rivalBlockerWing.jump = 0;
            players.rivalBlockerSide.jump = 0;
            players.rivalBlockerCenter.pose = 'stand';
            players.rivalBlockerWing.pose = 'stand';
            players.rivalBlockerSide.pose = 'stand';

            players.rivalSpiker.x = 680;
            players.rivalSpiker.jump = 0;
            players.rivalSpiker.pose = 'land_recover';

            players.rivalLibero.x = 920;
            players.rivalLibero.jump = 0;
            players.rivalLibero.pose = 'ready_defense';

            ball.x = 720;
            ball.y = 260;
            ball.rot = 0;

            audio.playReceive();
            updateLabel("Frame 1: El Ataque Rival y la Gran Salvada del Líbero (#5)");
        }

        function updateLabel(text) {
            frameLabel.textContent = text;
        }

        // ==========================================
        // DIBUJADO DE LA CANCHA LATERAL REALISTA
        // ==========================================
        function drawFullCourtLateral(zoom = 1.0, panX = 0, panY = 0) {
            ctx.save();
            ctx.translate(panX, panY);
            if (zoom !== 1.0) {
                ctx.translate(W * 0.5, H * 0.5);
                ctx.scale(zoom, zoom);
                ctx.translate(-W * 0.5, -H * 0.5);
            }

            // 1. Estadio / Fondo con gradas y reflectores
            const gradStadium = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
            gradStadium.addColorStop(0, '#0a101f');
            gradStadium.addColorStop(0.55, '#121c33');
            gradStadium.addColorStop(1, '#1a243c');
            ctx.fillStyle = gradStadium;
            ctx.fillRect(-200, -100, W + 400, H + 200);

            // Reflectores de estadio
            ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
            for (let i = 1; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(W * (i / 5), 0);
                ctx.lineTo(W * (i / 5) - 220, H);
                ctx.lineTo(W * (i / 5) + 220, H);
                ctx.fill();
            }

            // Público en gradas en penumbra
            for (let r = 0; r < 4; r++) {
                const y = H * 0.35 + r * 20;
                for (let c = 20; c < W; c += 22) {
                    ctx.fillStyle = (Math.sin(c * 17 + r) > 0) ? '#283754' : '#1c273d';
                    ctx.beginPath();
                    ctx.arc(c, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Valla publicitaria de fondo
            ctx.fillStyle = '#0b0f1a';
            ctx.fillRect(0, H * 0.46, W, 22);
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(0, H * 0.46, W, 22);
            ctx.font = 'bold 9px sans-serif';
            ctx.fillStyle = '#00d2ff';
            ctx.fillText("VOLLEYMIND & LIFELAB CHAMPIONSHIP • DECISIÓN 24 - 24", 25, H * 0.488);

            // 2. Cancha de juego (Piso Taraflex y Madera de fondo)
            // Madera de fondo (área libre)
            const gradFloor = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
            gradFloor.addColorStop(0, '#d97724');
            gradFloor.addColorStop(1, '#9e4608');
            ctx.fillStyle = gradFloor;
            ctx.fillRect(-100, FLOOR_Y, W + 200, H - FLOOR_Y + 100);

            // Pista oficial Taraflex Azul
            ctx.fillStyle = '#1752aa';
            ctx.fillRect(50, FLOOR_Y - 5, W - 100, H - FLOOR_Y + 10);

            // Líneas reglamentarias blancas
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            // Línea de suelo
            ctx.beginPath();
            ctx.moveTo(50, FLOOR_Y);
            ctx.lineTo(W - 50, FLOOR_Y);
            ctx.stroke();

            // Líneas de 3 metros (Ataque)
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            // Línea 3m Nuestro Campo (Izquierda)
            ctx.beginPath();
            ctx.moveTo(NET_X - 180, FLOOR_Y);
            ctx.lineTo(NET_X - 180, FLOOR_Y + 70);
            ctx.stroke();
            // Línea 3m Campo Rival (Derecha)
            ctx.beginPath();
            ctx.moveTo(NET_X + 180, FLOOR_Y);
            ctx.lineTo(NET_X + 180, FLOOR_Y + 70);
            ctx.stroke();

            // Línea central (Debajo de la red)
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(NET_X, FLOOR_Y);
            ctx.lineTo(NET_X, FLOOR_Y + 70);
            ctx.stroke();

            // Rótulos de campo
            ctx.font = '900 12px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.textAlign = 'center';
            ctx.fillText("NUESTRO CAMPO (ZONA 4 / ZONA 3)", NET_X * 0.5, FLOOR_Y + 40);
            ctx.fillText("CAMPO RIVAL", NET_X + (W - NET_X) * 0.5, FLOOR_Y + 40);

            ctx.restore();
        }

        // ==========================================
        // DIBUJADO DE LA RED PROFESIONAL EN EL MEDIO
        // ==========================================
        function drawCenterNet() {
            ctx.save();
            // Poste central
            ctx.fillStyle = '#37474f';
            ctx.fillRect(NET_X - 4, NET_TOP_Y - 40, 8, (FLOOR_Y - NET_TOP_Y) + 40);

            // Banda superior blanca de 7 cm con cable de tensión
            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = '#05070e';
            ctx.lineWidth = 1.5;
            ctx.fillRect(NET_X - 3, NET_TOP_Y, 6, 14);
            ctx.strokeRect(NET_X - 3, NET_TOP_Y, 6, 14);

            // Banda inferior
            ctx.fillRect(NET_X - 2.5, FLOOR_Y - 10, 5, 10);
            ctx.strokeRect(NET_X - 2.5, FLOOR_Y - 10, 5, 10);

            // Malla de voleibol cuadriculada
            ctx.strokeStyle = 'rgba(240, 248, 255, 0.85)';
            ctx.lineWidth = 1.2;
            for (let y = NET_TOP_Y + 14; y < FLOOR_Y - 10; y += 12) {
                ctx.beginPath();
                ctx.moveTo(NET_X - 3, y);
                ctx.lineTo(NET_X + 3, y);
                ctx.stroke();
            }

            // Antena reglamentaria con franjas rojas y blancas sobre la red
            const antX = NET_X - 1;
            const antTop = NET_TOP_Y - 70;
            ctx.lineWidth = 3;
            for (let seg = 0; seg < 7; seg++) {
                ctx.strokeStyle = (seg % 2 === 0) ? '#ff1744' : '#ffffff';
                ctx.beginPath();
                ctx.moveTo(antX, antTop + seg * 10);
                ctx.lineTo(antX, antTop + (seg + 1) * 10);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ==========================================
        // DIBUJADO DE JUGADORES MANGA / WEBTOON
        // ==========================================
        function drawPlayerFigure(pData, facingLeft = false) {
            ctx.save();
            ctx.translate(pData.x, pData.y);

            if (facingLeft) ctx.scale(-1, 1);

            // Sombra en el suelo
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(0, 0, pData.jump ? 16 : 30, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Desplazamiento por salto
            if (pData.jump) ctx.translate(0, -pData.jump);

            ctx.strokeStyle = '#05070e';
            ctx.lineWidth = 3.5;

        // Balón de voleibol tricolor
        function drawMangaBall(x, y, r, rot = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Paneles azul y amarillo
            ctx.beginPath();
            ctx.arc(0, 0, r, -0.6, 1.2);
            ctx.lineTo(0, 0);
            ctx.fillStyle = '#0066ff';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, r, 1.5, 3.2);
            ctx.lineTo(0, 0);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#05070e';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(-r, 0);
            ctx.quadraticCurveTo(0, -r * 0.35, r, 0);
            ctx.moveTo(0, -r);
            ctx.quadraticCurveTo(r * 0.35, 0, 0, r);
            ctx.stroke();

            ctx.restore();
        }

        // Onomatopeyas estilo Manga
        function drawComicOnomatopoeia(text, x, y, size = 52, color = '#ffeb3b') {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-0.06);

            ctx.font = `900 ${size}px 'Impact', 'Arial Black', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.lineWidth = 8;
            ctx.strokeStyle = '#05070e';
            ctx.strokeText(text, 0, 0);

            ctx.fillStyle = color;
            ctx.fillText(text, 0, 0);

            ctx.restore();
        }

        // Marcador digital
        function drawScoreboard(scoreUs = 24, scoreThem = 24) {
            ctx.save();
            ctx.translate(W * 0.5, 52);

            ctx.fillStyle = 'rgba(8, 14, 26, 0.95)';
            ctx.strokeStyle = '#32456b';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.roundRect(-130, -30, 260, 60, 10);
            ctx.fill();
            ctx.stroke();

            ctx.font = '800 11px sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'center';
            ctx.fillText("SET FINAL (DEUCE)", 0, -12);

            ctx.font = '900 28px monospace';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`${scoreUs} : ${scoreThem}`, 0, 18);

            ctx.font = 'bold 11px sans-serif';
            ctx.fillStyle = '#00d2ff';
            ctx.fillText("NOSOTROS", -70, -12);
            ctx.fillStyle = '#ff4757';
            ctx.fillText("RIVAL", 70, -12);

            ctx.restore();
        }

        // ==========================================
        // ETAPAS Y SECUENCIA DE ANIMACIÓN LATERAL
        // ==========================================

        function renderFrame1(p) {
            // Perspectiva lateral completa
            drawFullCourtLateral(1.0, 0, 0);
            drawScoreboard(24, 24);

            // Speed lines horizontales de intensidad moderada
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.30)';
            for (let sl of speedLines) {
                ctx.lineWidth = sl.width;
                ctx.beginPath();
                ctx.moveTo(sl.x, sl.y);
                ctx.lineTo(sl.x - sl.len, sl.y);
                ctx.stroke();
                sl.x -= sl.speed;
                if (sl.x < 0) sl.x = W + sl.len;
            }

            // Actualización de posiciones en tiempo real
            // El líbero desliza en plancha tras salvar el balón
            players.libero.x = 280 - p * 25;
            players.libero.pose = 'dive_receive';

            // El armador #8 corre ágilmente hacia la zona de armado cerca de la red
            players.setter.x = 380 + p * 90; // Llega a NET_X - 70 (470)
            players.setter.jump = 0;
            // Al final de su carrera frena y empieza a flexionar para posicionarse
            players.setter.pose = (p > 0.82) ? 'crouch_prejump' : 'stand';

            // El rematador #10 inicia pasos de carrera preparatoria
            players.spiker.x = 180 + p * 50; // Llega a 230
            players.spiker.jump = 0;
            players.spiker.pose = (p > 0.8) ? 'spiker_loading' : 'stand';

            // Dibujar todos los compañeros en nuestro campo
            drawPlayerFigure(players.teammateCover, false);
            drawPlayerFigure(players.spiker, false);
            drawPlayerFigure(players.libero, false);
            drawPlayerFigure(players.setter, false);

            // Red central reglamentaria
            drawCenterNet();

            // Rivales en su campo (Derecha)
            // Rematador Rival #4 absorbe la caída de su ataque y retrocede a defensa
            players.rivalSpiker.x = 680 + p * 80; // Se repliega de 680 a 760
            players.rivalSpiker.jump = 0;
            players.rivalSpiker.pose = (p < 0.35) ? 'land_recover' : 'ready_defense';
            players.rivalLibero.x = 920;
            players.rivalLibero.pose = 'ready_defense';

            drawPlayerFigure(players.rivalBlockerCenter, true);
            drawPlayerFigure(players.rivalBlockerWing, true);
            drawPlayerFigure(players.rivalBlockerSide, true);
            drawPlayerFigure(players.rivalSpiker, true);
            drawPlayerFigure(players.rivalLibero, true);

            // TRAYECTORIA DEL BALÓN TRAS EL RESCATE MILAGROSO:
            // Sube con fuerza hacia lo alto del estadio (desacelerando de forma natural estilo anime)
            const startX = players.libero.x + 85;
            const startY = FLOOR_Y - 60;
            const apexX = NET_X - 70; // 470
            const apexY = 110;        // En lo alto bajo los focos de la cancha

            // Parábola de ascenso suave y flotante (ease-out cuadrático para suspensión en el cenit)
            const easeOut = 1 - Math.pow(1 - p, 1.8);
            ball.x = startX + (apexX - startX) * easeOut;
            ball.y = startY + (apexY - startY) * easeOut;
            ball.rot += 0.22;

            // Estela dorada del rescate
            ctx.strokeStyle = 'rgba(255, 235, 59, 0.7)';
            ctx.lineWidth = 3.5;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo((startX + apexX) * 0.5, startY - 180, ball.x, ball.y);
            ctx.stroke();
            ctx.setLineDash([]);

            drawMangaBall(ball.x, ball.y, 23, ball.rot);
            drawComicOnomatopoeia("¡¡BAM!!", startX - 10, startY - 45, 48, "#ffdd00");
        }

        function renderFrame2(p) {
            // Zoom cinematográfico y foco en el armador cargando el salto
            const zoom = 1.08;
            const panX = -((NET_X - 70) - W * 0.5) * (zoom - 1);
            const panY = -((FLOOR_Y - 140) - H * 0.5) * (zoom - 1);

            drawFullCourtLateral(zoom, panX, panY);

            // Overlay dramático tipo manga (viñeta radial oscura con foco en el armador y el balón)
            const focalX = (NET_X - 70) * zoom + panX;
            const focalY = (FLOOR_Y - 120) * zoom + panY;

        function renderFrame3(p) {
            // PERSPECTIVA LATERAL CONTINUA: Ejecución en nuestro campo
            drawFullCourtLateral(1.0, 0, 0);
            drawScoreboard(24, 24);

            drawPlayerFigure(players.teammateCover, false);
            drawPlayerFigure(players.libero, false);

            if (selectedRoute === 'PASS') {
                // RUTA A: El Armador salta y coloca a Zona 4
                if (p <= 0.35) {
                    // Fase 1: Despegue del Armador desde el suelo hacia el balón que desciende
                    const tJump = p / 0.35;
                    players.setter.x = NET_X - 70;
                    players.setter.jump = tJump * 95; // El armador SUBE
                    players.setter.pose = (tJump > 0.4) ? 'jump_set' : 'crouch_prejump';

                    players.spiker.x = 230 + tJump * 20;
                    players.spiker.jump = 0;
                    players.spiker.pose = 'spiker_loading';

                    // EL BALÓN DESCIENDE mientras el armador sube hasta encontrarse en las manos:
                    const ballStartY = 165;
                    const meetBallY = (FLOOR_Y - 95) - 145; // 250
                    ball.x = NET_X - 70;
                    ball.y = ballStartY + tJump * (meetBallY - ballStartY); // Baja de 165 a 250
                    ball.rot += 0.1;

                    drawPlayerFigure(players.setter, false);
                    drawPlayerFigure(players.spiker, false);

                } else {
                    // Fase 2: Toque suave con las yemas hacia Zona 4 y despegue del Rematador #10
                    const tPass = (p - 0.35) / 0.65;
                    players.setter.x = NET_X - 70;
                    players.setter.jump = Math.max(0, 95 - tPass * 40);
                    players.setter.pose = 'jump_set';

                    // Rematador #10 vuela hacia el balón por Zona 4 (lado izquierdo, nuestro campo)
                    players.spiker.x = 250 + tPass * 110; // Llega a 360
                    players.spiker.jump = tPass * 115;    // Se eleva sobre la red
                    players.spiker.pose = 'jump_smash';

                    // Rivales ya empiezan a saltar al ver el armado hacia Zona 4
                    players.rivalBlockerCenter.jump = tPass * 85;
                    players.rivalBlockerWing.jump = tPass * 90;
                    players.rivalBlockerCenter.pose = 'block_wall';
                    players.rivalBlockerWing.pose = 'block_wall';

                    // Rival #4 se recoloca en cobertura defensiva
                    players.rivalSpiker.x = 760 - tPass * 30;
                    players.rivalSpiker.jump = 0;
                    players.rivalSpiker.pose = 'ready_defense';

                    // Trayectoria del pase flotante hacia Zona 4:
                    const startX = NET_X - 75;
                    const startY = (FLOOR_Y - 95) - 145; // Altura del toque del armador (~250)
                    const targetX = 350;
                    const targetY = NET_TOP_Y - 50;

                    ball.x = (1 - tPass) * startX + tPass * targetX;
                    ball.y = (1 - tPass) * (1 - tPass) * startY + 2 * (1 - tPass) * tPass * (startY - 65) + tPass * tPass * targetY;
                    ball.rot += 0.2;

                    // Estela verde del armado milimétrico
                    ctx.strokeStyle = 'rgba(0, 230, 118, 0.85)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.quadraticCurveTo((startX + targetX) * 0.5, startY - 65, ball.x, ball.y);
                    ctx.stroke();

                    drawComicOnomatopoeia("¡¡SUAVE!!", startX - 35, startY - 20, 42, "#00e676");

                    drawPlayerFigure(players.setter, true); // Mira hacia Zona 4
                    drawPlayerFigure(players.spiker, false);

            } else if (selectedRoute === 'SPIKE') {

                players.rivalBlockerSide.jump = tJump * 105;
                players.rivalBlockerCenter.pose = 'block_wall';
                players.rivalBlockerWing.pose = 'block_wall';
                players.rivalBlockerSide.pose = 'block_wall';

                // ¡EL BALÓN BAJA MIENTRAS EL JUGADOR SUBE!

        // ==========================================
        // BUCLE PRINCIPAL DE ANIMACIÓN FLUIDA (60 FPS)
        // ==========================================
        function animate() {
            ctx.save();

            // Temblor de pantalla (Screen Shake)
            if (screenShake > 0.5) {
                const ox = (Math.random() - 0.5) * screenShake;
                const oy = (Math.random() - 0.5) * screenShake;
                ctx.translate(ox, oy);
                screenShake *= 0.9;
            }

            ctx.clearRect(0, 0, W, H);

            if (!isPaused) {
                if (stage === 1) {
                    progress += 0.0065; // Movimiento fluido y majestuoso de rescate y elevación
                    renderFrame1(Math.min(1.0, progress));

                    if (progress >= 1.0) {
                        stage = 2;
                        progress = 0;
                        isPaused = true;
                        qteTimeRemaining = 1.0;
                        qteOverlay.style.display = 'flex';
                        audio.playHeartbeat();
                        updateLabel("Frame 2: El Armador #8 a Punto de Saltar • Freeze-Frame QTE");
                    }
                } else if (stage === 3) {
                    progress += 0.0075; // Salto y pase con suficiente tiempo para apreciar
                    renderFrame3(Math.min(1.0, progress));

                    if (progress >= 1.0) {
                        if (selectedRoute === 'PASS') {
                            stage = 4;
                            progress = 0;
                            flashOpacity = 1.0;
                            screenShake = 24;
                            audio.playSpikeSmash();
                            updateLabel("Frame 4: ¡Remate Ganador del Rematador #10! (25-24)");
                        } else if (selectedRoute === 'SPIKE') {
                            stage = 5;
                            progress = 0;
                            flashOpacity = 0.8;
                            screenShake = 24;
                            audio.playMonsterBlock();
                            updateLabel("Frame 5: ¡Triple Bloqueo Rival Monster Block! (24-25)");
                        } else {
                            stage = 6;
                            progress = 0;
                            flashOpacity = 1.0;
                            screenShake = 26;
                            audio.playSpikeSmash();
                            updateLabel("Frame 6: ¡El balón se pasó sin armado y el rival define! (24-25)");
                        }
                    }
                } else if (stage === 4) {
                    progress = Math.min(1.0, progress + 0.008);
                    renderFrame4(progress);
                } else if (stage === 5) {
                    progress = Math.min(1.0, progress + 0.009);
                    renderFrame5(progress);
                } else if (stage === 6) {
                    progress = Math.min(1.0, progress + 0.009);
                    renderFrame6(progress);
                }
            } else if (stage === 2) {
                renderFrame2(progress);

                // Temporizador QTE (duración ~5.5 segundos para decidir)
                qteTimeRemaining -= 0.0030;
                qteTimerFill.style.width = (Math.max(0, qteTimeRemaining) * 100) + '%';

                if (qteTimeRemaining <= 0) {
                    chooseRoute('OVERBALL');
                }
            }

            // Destello flash blanco
            if (flashOpacity > 0.02) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashOpacity})`;
                ctx.fillRect(0, 0, W, H);
                flashOpacity *= 0.84;
            }

            // Marco cómic
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, W, H);

            ctx.restore();
            requestAnimationFrame(animate);
        }

        function chooseRoute(route) {
            audio.init();
            selectedRoute = route;
            qteOverlay.style.display = 'none';
            isPaused = false;
            progress = 0;

            stage = 3;

            if (route === 'PASS') {
                audio.playSoftTouch();
                updateLabel("Frame 3: Despegue del Armador y Pase Milimétrico a Zona 4");
            } else if (route === 'SPIKE') {
                updateLabel("Frame 3: Salto a la Red para Intentar Finta Sorpresa");
            } else {
                updateLabel("Frame 3: ¡Indecisión! El balón se pasa de largo hacia el rival");
            }
        }

        // --- EVENTOS ---
        btnChoosePass.addEventListener('click', (e) => {
            e.stopPropagation();
            chooseRoute('PASS');
        });

        btnChooseSpike.addEventListener('click', (e) => {
            e.stopPropagation();
            chooseRoute('SPIKE');
        });

        btnRestart.addEventListener('click', () => {
            resetSequence();
        });

        btnSoundToggle.addEventListener('click', () => {
            audio.init();
            audio.enabled = !audio.enabled;
            btnSoundToggle.textContent = audio.enabled ? '🔊 Sonido (Activado)' : '🔇 Sonido (Silenciado)';
        });

        window.addEventListener('click', () => {
            audio.init();
        }, { once: true });

        // Iniciar
        resetSequence();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
